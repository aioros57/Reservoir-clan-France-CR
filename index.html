
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réservoir clan de France Clash Royale</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      suppressDeprecationWarnings: true,
      theme: {
        extend: {
          colors: { royale: { gold: '#FFC700', blue: '#1E63B3', darkBlue: '#0E2E5B' } },
          fontFamily: { clash: ['"Fredoka One"', 'cursive'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F6FA; color: #1E293B; }
    .font-clash { font-family: 'Fredoka One', cursive; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    .btn-gold { background: linear-gradient(180deg, #FFDF00 0%, #FFC700 100%); border-bottom: 4px solid #C49800; }
    .btn-blue { background: linear-gradient(180deg, #2B72CB 0%, #1E63B3 100%); border-bottom: 4px solid #144680; }
    .btn-green { background: linear-gradient(180deg, #34D399 0%, #059669 100%); border-bottom: 4px solid #047857; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <header class="bg-royale-darkBlue text-white sticky top-0 z-40 border-b-4 border-royale-gold shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-royale-gold rounded-2xl flex items-center justify-center text-royale-darkBlue text-2xl font-clash shadow-inner transform -rotate-3 border-2 border-white">👑</div>
        <div>
          <h1 class="text-xl sm:text-2xl font-clash tracking-wide text-royale-gold">Réservoir clan de France Clash Royale</h1>
          <p class="text-xs text-blue-200 flex items-center gap-2">
            <span id="storage-status-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500 text-slate-900">⚡ Initialisation...</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="toggleModal('register-clan-modal')" class="btn-green px-3 py-2 rounded-xl font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus-circle"></i><span>Inscrire mon Clan</span>
        </button>
        <button onclick="openAdminAuth()" class="btn-blue px-3 py-2 rounded-xl font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-user-shield"></i><span>Admin Créateur</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
    
    <div class="bg-white p-4 rounded-2xl card-shadow border border-slate-100 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
      <input type="text" id="search-input" oninput="renderClans()" placeholder="Rechercher par nom de clan ou #TAG..." class="w-full md:w-1/2 px-4 py-2.5 bg-slate-50 border rounded-xl font-medium" />
      <select id="sort-select" onchange="renderClans()" class="w-full md:w-auto bg-slate-50 border rounded-xl px-4 py-2.5 font-bold cursor-pointer">
        <option value="alpha-asc">🔤 Ordre Alphabétique (A - Z)</option>
        <option value="trophies-desc">🏆 Trophées de Clan</option>
        <option value="warTrophies-desc">⚔️ Trophées de Guerre</option>
        <option value="members-desc">👥 Nombre de membres</option>
      </select>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-4 rounded-2xl border card-shadow">
        <div class="text-xs text-slate-500 font-bold uppercase">Clans Inscrits</div>
        <div id="stat-total-clans" class="text-xl font-clash">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border card-shadow">
        <div class="text-xs text-slate-500 font-bold uppercase">Membres Réels</div>
        <div id="stat-total-members" class="text-xl font-clash">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border card-shadow">
        <div class="text-xs text-slate-500 font-bold uppercase">Trophées Cumulés</div>
        <div id="stat-total-trophies" class="text-xl font-clash">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border card-shadow">
        <div class="text-xs text-slate-500 font-bold uppercase">Synchro Cloud</div>
        <div class="text-xs font-bold text-green-600 mt-1">🟢 Actif</div>
      </div>
    </div>

    <!-- LISTE CLANS -->
    <div id="clans-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border card-shadow">
      <div class="text-5xl mb-3">🛡️</div>
      <h3 class="text-lg font-clash text-slate-700">Aucun clan inscrit pour le moment</h3>
      <p class="text-xs text-slate-500 mt-1">Cliquez sur "Inscrire mon Clan" pour ajouter le premier !</p>
    </div>

  </main>

  <!-- MODAL : INSCRIPTION CLAN -->
  <div id="register-clan-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 card-shadow border relative max-h-[90vh] overflow-y-auto">
      <button onclick="toggleModal('register-clan-modal')" class="absolute top-4 right-4 font-bold text-xl">&times;</button>
      <h2 class="text-xl font-clash text-slate-800 mb-4">Inscrire votre Clan</h2>

      <form onsubmit="handlePublicAddClan(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="block font-bold">Rôle *</label><select id="pub-user-role" class="w-full p-2 border rounded-lg"><option value="Chef">👑 Chef</option><option value="Adjoint">⚔️ Adjoint</option></select></div>
          <div><label class="block font-bold">Nom du Clan *</label><input type="text" id="pub-clan-name" required placeholder="Ex: Team French" class="w-full p-2 border rounded-lg" /></div>
          <div><label class="block font-bold">#TAG du Clan *</label><input type="text" id="pub-clan-tag" required placeholder="#QC29VC08" class="w-full p-2 border rounded-lg" /></div>
          <div><label class="block font-bold">Nom du Chef *</label><input type="text" id="pub-clan-leader" required class="w-full p-2 border rounded-lg" /></div>
          <div><label class="block font-bold">Nom d'un Adjoint *</label><input type="text" id="pub-clan-co-leader" required class="w-full p-2 border rounded-lg" /></div>
          <div>
            <label class="block font-bold">Style *</label>
            <select id="pub-clan-type" class="w-full p-2 border rounded-lg font-bold">
              <option value="Guerre de clan">⚔️ Guerre de clan</option>
              <option value="Chill">🌿 Chill</option>
              <option value="Mixte" selected>⚖️ Mixte</option>
            </select>
          </div>
          <div><label class="block font-bold">Trophées</label><input type="number" id="pub-clan-trophies" value="50000" class="w-full p-2 border rounded-lg" /></div>
          <div><label class="block font-bold">Membres (max 50)</label><input type="number" id="pub-clan-members" min="1" max="50" value="45" class="w-full p-2 border rounded-lg" /></div>
          <div class="sm:col-span-2"><label class="block font-bold">Lien Discord</label><input type="url" id="pub-clan-discord" placeholder="https://discord.gg/..." class="w-full p-2 border rounded-lg" /></div>
        </div>
        <button id="submit-btn" type="submit" class="btn-green w-full py-2.5 rounded-xl font-bold text-white text-sm mt-4">🚀 Valider et Publier</button>
      </form>
    </div>
  </div>

  <script>
    // TES IDENTIFIANTS SUPABASE
    const SUPABASE_URL = "https://ivdxqtvlynbhwejjtsrb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HwJQpCWsfU-dCerqQPZK7w_eWhDkgOy"; 

    let clansData = [];
    let supabaseClient = null;

    window.onload = function() {
      initApp();
    };

    async function initApp() {
      const badge = document.getElementById("storage-status-badge");
      try {
        if (window.supabase) {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          const { data, error } = await supabaseClient.from('clans').select('*');
          if (error) throw error;
          
          if (data) {
            clansData = data.map(c => ({
              id: c.id,
              name: c.name,
              tag: c.tag,
              leader: c.leader,
              coLeader: c.co_leader,
              type: c.type || "Mixte",
              league: c.league || "Ligue d'Or I",
              trophies: c.trophies || 0,
              warTrophies: c.war_trophies || 1500,
              members: c.members || 1,
              discord: c.discord || ''
            }));
          }
          badge.innerText = "☁️ Supabase Connecté";
          badge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-green-500 text-white";
        }
      } catch (err) {
        console.warn("Utilisation du LocalStorage :", err);
        badge.innerText = "⚡ Mode Hors-Ligne (Local)";
        badge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500 text-slate-900";
        const local = localStorage.getItem("clash_clans_db");
        clansData = local ? JSON.parse(local) : [];
      }
      renderClans();
    }

    async function handlePublicAddClan(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ Publication...";

      const tagInput = document.getElementById('pub-clan-tag').value.trim();
      const cleanTag = tagInput.startsWith('#') ? tagInput : '#' + tagInput;

      const newClan = {
        id: Date.now().toString(),
        name: document.getElementById('pub-clan-name').value.trim(),
        tag: cleanTag,
        leader: document.getElementById('pub-clan-leader').value.trim(),
        coLeader: document.getElementById('pub-clan-co-leader').value.trim(),
        type: document.getElementById('pub-clan-type').value,
        trophies: parseInt(document.getElementById('pub-clan-trophies').value) || 0,
        members: parseInt(document.getElementById('pub-clan-members').value) || 1,
        discord: document.getElementById('pub-clan-discord').value.trim()
      };

      if (supabaseClient) {
        await supabaseClient.from('clans').insert([{
          id: newClan.id, name: newClan.name, tag: newClan.tag,
          leader: newClan.leader, co_leader: newClan.coLeader,
          type: newClan.type, trophies: newClan.trophies,
          members: newClan.members, discord: newClan.discord
        }]);
      }

      clansData.push(newClan);
      localStorage.setItem("clash_clans_db", JSON.stringify(clansData));
      renderClans();

      submitBtn.disabled = false;
      submitBtn.innerText = "🚀 Valider et Publier";
      toggleModal('register-clan-modal');
      alert(`🎉 Clan ${newClan.name} ajouté avec succès !`);
    }

    function renderClans() {
      const container = document.getElementById('clans-container');
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();

      let filtered = clansData.filter(c => c.name.toLowerCase().includes(searchVal) || c.tag.toLowerCase().includes(searchVal));

      document.getElementById('stat-total-clans').innerText = clansData.length;
      document.getElementById('stat-total-members').innerText = clansData.reduce((acc, c) => acc + (parseInt(c.members) || 0), 0);
      document.getElementById('stat-total-trophies').innerText = clansData.reduce((acc, c) => acc + (parseInt(c.trophies) || 0), 0).toLocaleString();

      if (filtered.length === 0) {
        container.innerHTML = '';
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      document.getElementById('empty-state').classList.add('hidden');
      container.innerHTML = filtered.map(clan => `
        <div class="bg-white rounded-2xl border card-shadow p-5 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="text-lg font-clash text-slate-800">${escapeHTML(clan.name)}</h3>
            <span class="bg-slate-100 font-mono text-xs px-2 py-0.5 rounded font-bold">${escapeHTML(clan.tag)}</span>
          </div>
          <div class="text-xs space-y-1 text-slate-600">
            <p><strong>👑 Chef:</strong> ${escapeHTML(clan.leader)}</p>
            <p><strong>⚔️ Adjoint:</strong> ${escapeHTML(clan.coLeader)}</p>
            <p><strong>🏆 Trophées:</strong> ${clan.trophies.toLocaleString()}</p>
            <p><strong>👥 Membres:</strong> ${clan.members}/50</p>
          </div>
          ${clan.discord ? `<a href="${clan.discord}" target="_blank" class="block w-full bg-indigo-600 text-white font-bold py-2 rounded-xl text-center text-xs">Discord</a>` : ''}
        </div>
      `).join('');
    }

    function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
    function escapeHTML(str) { return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  </script>
</body>
</html>
