
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Clans - Team French</title>

  <!-- Script Supabase JS (version CDN officielle) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ⚠️ REMPLACE PAR TES CLÉS SUPABASE :
    const SUPABASE_URL = "https://ivdxqtvlynbhwejjtsrb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HwJQpCWsfU-dCerqQPZK7w_eWhDkgOy";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 { text-align: center; margin-bottom: 2rem; color: #60a5fa; }

    .form-container {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      outline: none;
    }

    button.btn-add {
      grid-column: 1 / -1;
      padding: 0.8rem;
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    button.btn-add:hover { background: var(--accent-hover); }

    .clan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .clan-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      position: relative;
    }

    .clan-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .clan-badge { width: 50px; height: 50px; object-fit: contain; }
    .clan-title h2 { font-size: 1.25rem; }
    .clan-tag { color: var(--text-sub); font-size: 0.85rem; }

    .clan-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .btn-delete {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .btn-discord {
      display: block;
      text-align: center;
      padding: 0.5rem;
      background: #5865F2;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <h1>Gestion des Clans - Alliance Team French</h1>

  <!-- Formulaire d'ajout -->
  <div class="form-container">
    <h3 style="margin-bottom: 1rem;">Ajouter un Clan</h3>
    <form id="addClanForm" onsubmit="ajouterClan(event)">
      <div class="form-grid">
        <input type="text" id="name" placeholder="Nom du Clan (ex: French 1)" required />
        <input type="text" id="tag" placeholder="Tag (#QQPPLJ0U)" required />
        <input type="text" id="leader" placeholder="Chef" required />
        <input type="text" id="co_leader" placeholder="Sous-Chef" />
        <select id="type">
          <option value="Mixte">Mixte</option>
          <option value="Rush">Rush</option>
          <option value="GDC">GDC</option>
          <option value="École / Académie">École / Académie</option>
        </select>
        <input type="text" id="league" placeholder="Ligue (ex: Ligue de Ligue d'Or I)" />
        <input type="number" id="trophies" placeholder="Trophées Requis" />
        <input type="number" id="war_trophies" placeholder="Trophées GDC" />
        <input type="number" id="members" placeholder="Membres (ex: 45)" max="50" />
        <input type="url" id="badge_url" placeholder="URL Image Badge/Emblème" />
        <input type="url" id="discord" placeholder="Lien Discord" />
        <button type="submit" class="btn-add">+ Ajouter le Clan</button>
      </div>
    </form>
  </div>

  <!-- Liste des clans -->
  <div id="clanList" class="clan-grid"></div>

  <script>
    // Charger la liste des clans
    async function chargerClans() {
      const { data: clans, error } = await db.from('clans').select('*').order('created_at', { ascending: true });
      if (error) {
        console.error("Erreur de chargement :", error);
        return;
      }

      const listContainer = document.getElementById('clanList');
      listContainer.innerHTML = '';

      clans.forEach(clan => {
        const card = document.createElement('div');
        card.className = 'clan-card';
        card.innerHTML = `
          <button class="btn-delete" onclick="supprimerClan('${clan.id}')">🗑️</button>
          <div class="clan-header">
            <img class="clan-badge" src="${clan.badge_url || 'https://via.placeholder.com/50'}" alt="Badge" />
            <div class="clan-title">
              <h2>${clan.name}</h2>
              <div class="clan-tag">${clan.tag}</div>
            </div>
          </div>
          <div class="clan-stats">
            <div><strong>Chef:</strong> ${clan.leader}</div>
            <div><strong>Co-Chef:</strong> ${clan.co_leader || 'N/A'}</div>
            <div><strong>Type:</strong> ${clan.type}</div>
            <div><strong>Ligue:</strong> ${clan.league}</div>
            <div><strong>Trophées:</strong> ${clan.trophies} 🏆</div>
            <div><strong>Trophées GDC:</strong> ${clan.war_trophies} ⚔️</div>
            <div><strong>Membres:</strong> ${clan.members}/50</div>
          </div>
          ${clan.discord ? `<a href="${clan.discord}" target="_blank" class="btn-discord">Rejoindre Discord</a>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    // Ajouter un clan dans Supabase
    async function ajouterClan(e) {
      e.preventDefault();
      const newClan = {
        id: crypto.randomUUID(),
        name: document.getElementById('name').value,
        tag: document.getElementById('tag').value,
        leader: document.getElementById('leader').value,
        co_leader: document.getElementById('co_leader').value,
        type: document.getElementById('type').value,
        league: document.getElementById('league').value || "Ligue d'Or I",
        trophies: parseInt(document.getElementById('trophies').value) || 0,
        war_trophies: parseInt(document.getElementById('war_trophies').value) || 1500,
        members: parseInt(document.getElementById('members').value) || 1,
        badge_url: document.getElementById('badge_url').value,
        discord: document.getElementById('discord').value
      };

      const { error } = await db.from('clans').insert([newClan]);
      if (error) {
        alert("Erreur lors de l'ajout : " + error.message);
      } else {
        document.getElementById('addClanForm').reset();
        chargerClans();
      }
    }

    // Supprimer un clan de Supabase
    async function supprimerClan(id) {
      if (confirm("Supprimer ce clan ?")) {
        const { error } = await db.from('clans').delete().eq('id', id);
        if (error) {
          alert("Erreur de suppression : " + error.message);
        } else {
          chargerClans();
        }
      }
    }

    // Lancer le chargement au démarrage
    chargerClans();
  </script>
</body>
</html>
